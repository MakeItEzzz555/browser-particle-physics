<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Physics Particle Sandbox - FINAL FIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.137.5/build/three.module.js",
          "three/examples/jsm/": "https://unpkg.com/three@0.137.5/examples/jsm/"
        }
      }
    </script>
    <style>
      /* --- Custom UI Styles --- */
      :root {
          --bg-1: #050915;
          --bg-2: #0c1628;
          --panel: rgba(16, 26, 43, 0.88);
          --accent: #6cf6ff;
          --text: #e8edf5;
          --muted: #8da0bf;
          --border: rgba(255, 255, 255, 0.08);
      }

      body { 
          margin: 0; 
          overflow: hidden; 
          display: flex; 
          align-items: center; 
          justify-content: center; 
          min-height: 100vh; 
          background: radial-gradient(circle at 20% 20%, rgba(108, 246, 255, 0.08), transparent 30%),
                      radial-gradient(circle at 80% 0%, rgba(93, 104, 255, 0.12), transparent 32%),
                      linear-gradient(160deg, var(--bg-1), var(--bg-2));
          color: var(--text); 
          font-family: 'Space Grotesk', sans-serif;
      }
      
      #canvas-container { position: fixed; inset: 0; width: 100%; height: 100%; }
      #canvas-container canvas { width: 100%; height: 100%; cursor: grab; }

      #controls { 
          position: absolute; 
          bottom: 20px; 
          left: 20px; 
          background: var(--panel); 
          border: 1px solid var(--border);
          padding: 15px; 
          border-radius: 16px; 
          width: 320px; 
          max-height: calc(100vh - 40px); 
          overflow-y: auto; 
          box-sizing: border-box; 
          z-index: 10;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      
      h2 { margin-top: 0; color: var(--accent); font-size: 1.2em; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 15px; }
      
      label { 
          display: flex; 
          justify-content: space-between; 
          align-items: center; 
          margin-bottom: 5px; 
          margin-top: 10px; 
          color: var(--muted);
          font-size: 0.9em;
      }
      
      select {
          width: 100%;
          padding: 10px 12px;
          border-radius: 12px;
          border: 1px solid var(--border);
          background: rgba(255, 255, 255, 0.03);
          color: var(--text);
          font-size: 14px;
      }

      input[type="range"] { 
          width: 100%; 
          margin-bottom: 5px; 
          height: 8px;
          appearance: none;
          background: linear-gradient(90deg, var(--accent), #5d68ff);
          border-radius: 999px;
      }

      input[type="range"]::-webkit-slider-thumb {
          appearance: none;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: white;
          border: 3px solid var(--bg-2);
          box-shadow: 0 0 0 4px rgba(108, 246, 255, 0.3);
          cursor: pointer;
      }
      
      input[type="color"] {
          width: 100%; 
          height: 30px;
          border: 1px solid var(--border);
          border-radius: 8px;
          background: var(--bg-2);
          padding: 0;
          cursor: pointer;
      }

      button { 
          margin-top: 20px; 
          padding: 10px 15px; 
          background: linear-gradient(135deg, rgba(108, 246, 255, 0.16), rgba(93, 104, 255, 0.18));
          color: var(--text); 
          border: 1px solid var(--border); 
          border-radius: 8px; 
          cursor: pointer; 
          font-weight: 600;
          width: 100%;
          transition: background 0.2s, transform 0.1s;
      }
      button:hover { 
          background: linear-gradient(135deg, rgba(108, 246, 255, 0.3), rgba(93, 104, 255, 0.3)); 
          transform: translateY(-1px);
      }
      
      #info { 
          position: absolute; 
          top: 20px; 
          right: 20px; 
          color: var(--muted); 
          font-size: 14px; 
          background: rgba(5, 9, 21, 0.7); 
          padding: 8px 12px; 
          border-radius: 8px; 
          border: 1px solid var(--border);
          z-index: 10; 
      }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">Orbit: drag • Zoom: scroll • Shift+drag: spin container</div>
    <div id="controls">
        <h2>Physics & Visual Controls</h2>
        
        <label for="particleCount-slider">Particle Count: <span id="particleCount-value">100</span></label>
        <input type="range" id="particleCount-slider" min="10" max="500" step="1" value="100">

        <label for="shape-select">Container Shape</label>
        <select id="shape-select">
          <option value="cube" selected>Cube</option>
          <option value="sphere">Sphere</option>
          <option value="pyramid">Pyramid</option>
        </select>

        <label for="containerSize-slider">Container Size: <span id="containerSize-value">15</span></label>
        <input type="range" id="containerSize-slider" min="8" max="30" step="1" value="15">

        <label for="gravity-slider">Gravity Strength (Y-): <span id="gravity-value">-0.050</span></label>
        <input type="range" id="gravity-slider" min="-0.2" max="0.2" step="0.005" value="-0.05">

        <label for="friction-slider">Friction/Air Drag: <span id="friction-value">0.990</span></label>
        <input type="range" id="friction-slider" min="0.95" max="1.0" step="0.001" value="0.99">

        <label for="bounce-slider">Wall Bounce (Restitution): <span id="bounce-value">0.70</span></label>
        <input type="range" id="bounce-slider" min="0.0" max="1.0" step="0.05" value="0.7">

        <label for="particleSize-slider">Particle Size: <span id="particleSize-value">0.50</span></label>
        <input type="range" id="particleSize-slider" min="0.1" max="2.0" step="0.05" value="0.5">

        <label for="particleColor-picker">Particle Color:</label>
        <input type="color" id="particleColor-picker" value="#00ffff">

        <label for="glowIntensity-slider">Glow Intensity: <span id="glowIntensity-value">0.80</span></label>
        <input type="range" id="glowIntensity-slider" min="0.0" max="2.0" step="0.05" value="0.8">
        
        <label for="glowRadius-slider">Glow Radius: <span id="glowRadius-value">0.30</span></label>
        <input type="range" id="glowRadius-slider" min="0.0" max="1.0" step="0.01" value="0.3">

        <button onclick="window.resetParticles()">Reset Particles</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.137.5/build/three.module.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.137.5/examples/jsm/controls/OrbitControls.js';
        import { EffectComposer } from 'https://unpkg.com/three@0.137.5/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://unpkg.com/three@0.137.5/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://unpkg.com/three@0.137.5/examples/jsm/postprocessing/UnrealBloomPass.js';

        // --- Core Setup Variables ---
        let scene, camera, renderer, controls, composer, bloomPass;
        let simGroup;
        let containerLines = null;
        let containerShape = 'cube';
        let CONTAINER_SIZE = 15;
        let PARTICLE_RADIUS = 0.5; 
        
        const particleMeshes = [];
        const particleVelocities = []; 
        let clock; 
        
        // Geometry holder (rebuilt when particle size changes)
        let particleGeometry = new THREE.SphereGeometry(PARTICLE_RADIUS, 16, 16); 
        let isSpinning = false;
        const lastPointer = new THREE.Vector2();
        let activePointerId = null;

        // --- Global Adjustable Constants (Linked to UI) ---
        let GRAVITY_STRENGTH = -0.05; 
        let FRICTION_FACTOR = 0.99;
        let RESTITUTION_COEFF = 0.7;
        let NUM_PARTICLES = 100;
        let GLOW_INTENSITY = 0.8;
        let GLOW_RADIUS = 0.3;
        let PARTICLE_COLOR = new THREE.Color(0x00ffff);

        // --- Initialization on Load ---
        window.addEventListener('DOMContentLoaded', () => {
             init();
             animate();
        });


        function init() {
            // --- Scene & Renderer Setup ---
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, CONTAINER_SIZE * 1.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // --- Controls ---
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0, 0);

            // --- Clock for Delta Time ---
            clock = new THREE.Clock();

            // --- Lighting and Container Group ---
            const ambientLight = new THREE.AmbientLight(0x404040, 2); 
            scene.add(ambientLight);

            simGroup = new THREE.Group();
            scene.add(simGroup);
            rebuildContainerVisuals();

            // --- Post-processing for Bloom Effect ---
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));

            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                GLOW_INTENSITY,
                GLOW_RADIUS,
                0.8
            );
            composer.addPass(bloomPass);

            // Initialize
            setupShapeDrag();
            setupControls();
            window.resetParticles(); // Initial particle spawn
            // Attach resize handler AFTER renderer and composer are defined
            window.addEventListener('resize', window.onWindowResize); 
            window.onWindowResize(); // Call once immediately after initialization
        }

        function rebuildContainerVisuals() {
            if (containerLines) {
                simGroup.remove(containerLines);
                containerLines.geometry.dispose();
                containerLines.material.dispose();
            }

            let geometry;
            if (containerShape === 'cube') {
                geometry = new THREE.BoxGeometry(CONTAINER_SIZE, CONTAINER_SIZE, CONTAINER_SIZE);
            } else if (containerShape === 'sphere') {
                geometry = new THREE.SphereGeometry(CONTAINER_SIZE * 0.5, 22, 16);
            } else { // pyramid (square base)
                geometry = new THREE.ConeGeometry(CONTAINER_SIZE * 0.5, CONTAINER_SIZE, 4, 1, true);
            }

            const edges = new THREE.EdgesGeometry(geometry);
            containerLines = new THREE.LineSegments(
                edges,
                new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.6 })
            );
            simGroup.add(containerLines);
        }


        // --- Particle Management (Globally Exposed) ---
        window.resetParticles = function() {
            // Dispose and remove old meshes
            particleMeshes.forEach(mesh => {
                simGroup.remove(mesh);
                mesh.material.dispose(); 
            });
            particleMeshes.length = 0;
            particleVelocities.length = 0;

            const spawn = () => {
                if (containerShape === 'sphere') {
                const r = (CONTAINER_SIZE * 0.5 - PARTICLE_RADIUS) * Math.cbrt(Math.random() * 0.8);
                let dir = new THREE.Vector3(
                    Math.random() * 2 - 1,
                    Math.random() * 2 - 1,
                    Math.random() * 2 - 1
                );
                while (dir.lengthSq() < 1e-4) {
                    dir.set(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1);
                }
                dir.normalize();
                return dir.multiplyScalar(r);
            }
                if (containerShape === 'pyramid') {
                    const hHalf = CONTAINER_SIZE * 0.5;
                    const y = Math.random() * CONTAINER_SIZE - hHalf;
                    const baseHalf = CONTAINER_SIZE * 0.5;
                    const span = baseHalf * (1 - (y + hHalf) / CONTAINER_SIZE);
                    const x = (Math.random() * 2 - 1) * span * 0.6;
                    const z = (Math.random() * 2 - 1) * span * 0.6;
                    return new THREE.Vector3(x, y, z);
                }
                // cube
                const range = (CONTAINER_SIZE * 0.5 - PARTICLE_RADIUS) * 0.6;
                return new THREE.Vector3(
                    (Math.random() * 2 - 1) * range,
                    (Math.random() * 2 - 1) * range,
                    (Math.random() * 2 - 1) * range
                );
            };

            for (let i = 0; i < NUM_PARTICLES; i++) {
                const material = new THREE.MeshPhysicalMaterial({
                    color: PARTICLE_COLOR,
                    emissive: PARTICLE_COLOR, 
                    emissiveIntensity: GLOW_INTENSITY,
                    roughness: 0.3,
                    metalness: 0.2
                }); 

                const mesh = new THREE.Mesh(particleGeometry, material);
                mesh.position.copy(spawn());
                simGroup.add(mesh);
                particleMeshes.push(mesh);
                
                particleVelocities.push(new THREE.Vector3(
                    Math.random() * 0.2 - 0.1,
                    Math.random() * 0.2 - 0.1,
                    Math.random() * 0.2 - 0.1
                ));
            }
        }

        // --- Control Setup ---
        function setupControls() {
             // Helper function to link sliders and update displays
            const bindSlider = (id, decimal) => {
                const slider = document.getElementById(id);
                const display = document.getElementById(`${id.split('-')[0]}-value`);
                
                slider.addEventListener('input', (event) => {
                    let value = parseFloat(event.target.value);
                    display.textContent = value.toFixed(decimal);

                    // Update global constant variables
                    if (id === 'gravity-slider') GRAVITY_STRENGTH = value;
                    else if (id === 'friction-slider') FRICTION_FACTOR = value;
                    else if (id === 'bounce-slider') RESTITUTION_COEFF = value;
                    else if (id === 'glowIntensity-slider') { GLOW_INTENSITY = value; bloomPass.strength = value; }
                    else if (id === 'glowRadius-slider') { GLOW_RADIUS = value; bloomPass.radius = value; }
                    else if (id === 'particleCount-slider') { 
                        NUM_PARTICLES = parseInt(event.target.value); 
                        window.resetParticles(); // Recreate particles
                    }
                    else if (id === 'containerSize-slider') {
                        CONTAINER_SIZE = value;
                        rebuildContainerVisuals();
                        window.resetParticles();
                        camera.position.set(0, 0, CONTAINER_SIZE * 1.5);
                        controls.update();
                    }
                    else if (id === 'particleSize-slider') {
                        PARTICLE_RADIUS = value;
                        particleGeometry.dispose();
                        particleGeometry = new THREE.SphereGeometry(PARTICLE_RADIUS, 16, 16);
                        window.resetParticles();
                    }
                });
            };
            
            bindSlider('particleCount-slider', 0);
            bindSlider('containerSize-slider', 0);
            bindSlider('gravity-slider', 3);
            bindSlider('friction-slider', 3);
            bindSlider('bounce-slider', 2);
            bindSlider('particleSize-slider', 2);
            bindSlider('glowIntensity-slider', 2);
            bindSlider('glowRadius-slider', 2);

            // Particle Color Picker (Updates all existing particles)
            document.getElementById('particleColor-picker').addEventListener('input', (event) => {
                const newColor = new THREE.Color(event.target.value);
                PARTICLE_COLOR.copy(newColor);
                
                // Update all meshes in the scene
                particleMeshes.forEach(mesh => {
                    mesh.material.color.copy(newColor);
                    mesh.material.emissive.copy(newColor); 
                    mesh.material.needsUpdate = true;
                });
            });

            // Container shape select
            document.getElementById('shape-select').addEventListener('change', (event) => {
                containerShape = event.target.value;
                rebuildContainerVisuals();
                window.resetParticles();
            });
        }

        // --- Window Resize Handling (Globally Exposed) ---
        window.onWindowResize = function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupShapeDrag() {
            const dragTarget = () => renderer?.domElement;
            const onDown = (e) => {
                if (!e.shiftKey) return;
                e.preventDefault();
                e.stopPropagation();
                const el = dragTarget();
                if (!el) return;
                isSpinning = true;
                activePointerId = e.pointerId;
                controls.enabled = false;
                lastPointer.set(e.clientX, e.clientY);
                el.setPointerCapture(e.pointerId);
                el.style.cursor = 'grabbing';
            };
            const onMove = (e) => {
                if (!isSpinning) return;
                const dx = e.clientX - lastPointer.x;
                const dy = e.clientY - lastPointer.y;
                lastPointer.set(e.clientX, e.clientY);
                const speed = 0.005;
                simGroup.rotation.y += dx * speed;
                simGroup.rotation.x += dy * speed;
                simGroup.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, simGroup.rotation.x));
            };
            const onUp = () => {
                if (isSpinning) {
                    isSpinning = false;
                    controls.enabled = true;
                    const el = dragTarget();
                    if (el) {
                        if (activePointerId !== null) {
                            try { el.releasePointerCapture(activePointerId); } catch (_) {}
                        }
                        el.style.cursor = 'grab';
                    }
                    activePointerId = null;
                }
            };
            const el = dragTarget();
            if (!el) return;
            el.addEventListener('pointerdown', onDown);
            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp);
            window.addEventListener('pointerleave', onUp);
            el.addEventListener('pointerenter', () => { if (!isSpinning) el.style.cursor = 'grab'; });
            el.addEventListener('pointercancel', onUp);
        }

        function enforceCube(position, velocity) {
            const limit = CONTAINER_SIZE / 2 - PARTICLE_RADIUS;
            ['x', 'y', 'z'].forEach(axis => {
                if (position[axis] > limit) {
                    position[axis] = limit;
                    velocity[axis] *= -RESTITUTION_COEFF;
                } else if (position[axis] < -limit) {
                    position[axis] = -limit;
                    velocity[axis] *= -RESTITUTION_COEFF;
                }
            });
        }

        function enforceSphere(position, velocity) {
            const limit = CONTAINER_SIZE * 0.5 - PARTICLE_RADIUS;
            const dist = position.length();
            if (dist > limit) {
                const normal = position.clone().normalize();
                position.copy(normal.multiplyScalar(limit));
                const vDotN = velocity.dot(normal);
                if (vDotN > 0) velocity.addScaledVector(normal, - (1 + RESTITUTION_COEFF) * vDotN);
            }
        }

        function enforcePyramid(position, velocity) {
            const hHalf = CONTAINER_SIZE * 0.5;
            const baseHalf = CONTAINER_SIZE * 0.5 - PARTICLE_RADIUS;
            const yTop = hHalf - PARTICLE_RADIUS;
            const yBottom = -hHalf + PARTICLE_RADIUS;

            if (position.y > yTop) {
                position.y = yTop;
                velocity.y *= -RESTITUTION_COEFF;
            } else if (position.y < yBottom) {
                position.y = yBottom;
                velocity.y *= -RESTITUTION_COEFF;
            }

            const span = baseHalf * (1 - (position.y + hHalf) / CONTAINER_SIZE);
            const maxSpan = Math.max(span, PARTICLE_RADIUS * 1.2);
            const manhattan = Math.abs(position.x) + Math.abs(position.z);
            if (manhattan > maxSpan) {
                const scale = maxSpan / manhattan;
                position.x *= scale;
                position.z *= scale;
                velocity.x *= -RESTITUTION_COEFF;
                velocity.z *= -RESTITUTION_COEFF;
            }
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Get time elapsed since the last frame
            const delta = clock.getDelta();

            // Maximum safe time step (prevents "tunneling" or explosions)
            const MAX_DELTA = 0.033;
            const dt = Math.min(delta, MAX_DELTA);

            // Physics applied per particle
            for (let i = 0; i < particleMeshes.length; i++) {
                const mesh = particleMeshes[i];
                const velocity = particleVelocities[i];
                const position = mesh.position;

                // 1. Apply Forces (Gravity)
                // We use 60 to normalize the gravity constant 'GRAVITY_STRENGTH' which was tuned for 60fps.
                velocity.y += GRAVITY_STRENGTH * dt * 60; 

                // 2. Apply Friction (Drag)
                velocity.multiplyScalar(FRICTION_FACTOR); 
                
                // 3. Update Position
                position.addScaledVector(velocity, dt * 60);

                // 4. Boundary Check (Collision) based on container shape
                if (containerShape === 'sphere') {
                    enforceSphere(position, velocity);
                } else if (containerShape === 'pyramid') {
                    enforcePyramid(position, velocity);
                } else {
                    enforceCube(position, velocity);
                }
            }

            controls.update(); 
            composer.render();
        }
    </script>
</body>
</html>
